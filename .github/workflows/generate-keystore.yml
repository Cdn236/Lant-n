name: Generate Lanten Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore lanten-release.jks \
            -alias lanten \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "LantenStore2026!" \
            -keypass "LantenKey2026!" \
            -dname "CN=Lanten, OU=Mobile, O=Lanten, L=Kampala, ST=Central, C=UG"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: lanten-release-keystore
          path: lanten-release.jks
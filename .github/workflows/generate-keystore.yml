name: Generate Production Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate production keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          keytool -genkeypair -v \
            -keystore lanten-release.jks \
            -alias lanten \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Lanten, OU=Mobile, O=Lanten, L=Kampala, ST=Central, C=UG"

      - name: Upload production keystore
        uses: actions/upload-artifact@v4
        with:
          name: lanten-production-keystore
          path: lanten-release.jks
          retention-days: 1